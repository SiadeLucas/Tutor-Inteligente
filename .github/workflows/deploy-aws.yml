name: Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Continuous Deployment via SSH
    runs-on: ubuntu-latest
    steps:
    - name: Deploy via SSH to AWS EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        script: |
          set -e
          echo "🚀 Iniciando deploy automatizado na AWS EC2..."
          cd /home/ubuntu/tutor-inteligente

          echo "📦 Atualizando código-fonte via Git..."
          git pull origin main

          echo "🐳 Construindo e reiniciando containers de produção..."
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          echo "🗄️ Executando migrações incrementais do banco (Alembic)..."
          docker compose -f docker-compose.prod.yml exec -T backend alembic upgrade head

          echo "📚 Sincronizando catálogo de 11 volumes, 63 capítulos e 63 aulas KaTeX..."
          docker compose -f docker-compose.prod.yml exec -T backend python -m scripts.seed_content

          echo "🎯 Sincronizando 315 itens calibrados TRI 3PL..."
          docker compose -f docker-compose.prod.yml exec -T backend python -m scripts.seed_exercises

          echo "✅ Deploy concluído com sucesso!"
