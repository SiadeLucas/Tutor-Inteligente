name: Tests and Lint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:
    name: Backend Pytest & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tutor_admin
          POSTGRES_PASSWORD: senhalocal123
          POSTGRES_DB: tutor_inteligente
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio flake8

    - name: Lint with Flake8
      run: |
        # Stop build on syntax errors or undefined names
        flake8 backend/app/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Backend Tests
      env:
        DATABASE_URL: postgresql+asyncpg://tutor_admin:senhalocal123@localhost:5432/tutor_inteligente
        REDIS_URL: redis://localhost:6379/0
        JWT_SECRET_KEY: testsecretkey123456789012345678901234567890
        ASAAS_API_KEY: ""
        ASAAS_ENVIRONMENT: sandbox
        GEMINI_API_KEY: mock_gemini_key
      run: |
        cd backend
        pytest tests/ -v

  frontend:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Dependencies
      run: |
        cd frontend
        npm ci

    - name: Lint and Typecheck
      run: |
        cd frontend
        npm run lint
        npx tsc --noEmit

    - name: Next.js Build
      run: |
        cd frontend
        npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:8000
