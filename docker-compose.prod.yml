# ==============================================================================
# Tutor Inteligente — Orquestração Docker Compose de Produção (AWS EC2)
# ==============================================================================
services:
  # ---------- Banco de Dados (PostgreSQL 16 + pgvector) ----------
  database:
    image: pgvector/pgvector:pg16
    container_name: tutor-db-prod
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME:-tutor_inteligente}
      POSTGRES_USER: ${DB_USER:-tutor_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - tutor-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tutor_admin} -d ${DB_NAME:-tutor_inteligente}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Cache & Sessões Voláteis (Redis 7) ----------
  redis:
    image: redis:7-alpine
    container_name: tutor-redis-prod
    restart: always
    env_file:
      - .env
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass $${REDIS_PASSWORD}"]
    volumes:
      - redis_prod_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - tutor-prod-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Backend API (FastAPI + Python 3.11) ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tutor-backend-prod
    restart: always
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - tutor-prod-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------- Frontend Web (Next.js 14 + TypeScript) ----------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* é inlinada em tempo de build — precisa vir como build-arg
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: tutor-frontend-prod
    restart: always
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - tutor-prod-network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  tutor-prod-network:
    driver: bridge
